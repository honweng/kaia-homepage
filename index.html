<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HW Tech Logo</title>
    <style>
        body {
            background-color: #0b0f19;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .logo-container {
            width: 300px;
            height: 300px;
            position: relative;
            background: radial-gradient(circle, rgba(59,130,246,0.2) 0%, rgba(11,15,25,1) 75%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 35px rgba(59, 130, 246, 0.25);
        }
        svg {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <!-- Extended Circuit Paths & Background Network -->
            <path d="M 20 130 L 50 130 L 70 110 L 85 110" fill="none" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M 180 70 L 150 70 L 130 90 L 115 90" fill="none" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M 70 20 L 70 60 L 90 80" fill="none" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M 130 180 L 130 140 L 110 120" fill="none" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round"/>
            
            <!-- Main Glowing Circuit Paths -->
            <path d="M 30 100 L 75 100 L 85 85" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
            <path d="M 170 100 L 125 100 L 115 115" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
            <path d="M 100 30 L 100 75 L 85 80" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
            <path d="M 100 170 L 100 125 L 115 120" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
            <path d="M 50 50 L 75 75" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M 150 150 L 125 125" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M 150 50 L 125 75" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M 50 150 L 75 125" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>

            <!-- Circuit Nodes -->
            <circle cx="30" cy="100" r="3" fill="#3b82f6" />
            <circle cx="170" cy="100" r="3" fill="#3b82f6" />
            <circle cx="100" cy="30" r="3" fill="#3b82f6" />
            <circle cx="100" cy="170" r="3" fill="#3b82f6" />
            <circle cx="50" cy="50" r="2.5" fill="#60a5fa" />
            <circle cx="150" cy="150" r="2.5" fill="#60a5fa" />
            <circle cx="150" cy="50" r="2.5" fill="#60a5fa" />
            <circle cx="50" cy="150" r="2.5" fill="#60a5fa" />
            <circle cx="85" cy="85" r="2" fill="#60a5fa" />
            <circle cx="115" cy="115" r="2" fill="#60a5fa" />
            <circle cx="20" cy="130" r="2" fill="#1e3a8a" />
            <circle cx="180" cy="70" r="2" fill="#1e3a8a" />

            <!-- HW Letters -->
            <text x="100" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="-2">HW</text>
        </svg>
    </div>
</body>
</html>
