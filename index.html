<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hon Weng • Software Engineer</title>
    <style>
        :root {
            --bg: #0b0f19;
            --card-bg: rgba(22, 27, 46, 0.85);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.25);
            --accent-fox: #f97316;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.12) 0px, transparent 50%);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
        }

        .profile-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 3rem 2.25rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px var(--border);
            text-align: center;
            max-width: 400px;
            width: 100%;
            transition: transform 0.3s ease;
        }

        .avatar-ring {
            width: 72px;
            height: 72px;
            margin: 0 auto 1.5rem;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        h1 {
            margin: 0 0 0.4rem 0;
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .role-tag {
            display: inline-block;
            color: var(--accent);
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 0.9rem 1.25rem;
            background-color: rgba(255, 255, 255, 0.04);
            color: var(--text);
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border);
        }

        .btn:hover {
            background-color: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
        }

        .btn-about {
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.12), rgba(236, 72, 153, 0.12));
            border-color: rgba(249, 115, 22, 0.35);
            color: #fb923c;
        }

        .btn-about:hover {
            border-color: #fb923c;
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.22), rgba(236, 72, 153, 0.22));
            box-shadow: 0 6px 20px rgba(249, 115, 22, 0.25);
        }

        .footer {
            margin-top: 2.25rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <div class="avatar-ring">⚡</div>
        <h1>Hon Weng</h1>
        <span class="role-tag">Software Engineer & Builder</span>

        <div class="links">
            <a href="https://github.com/honweng" target="_blank" class="btn">
                <span>💻</span> GitHub
            </a>
            <a href="https://www.linkedin.com/in/yeehonweng/" target="_blank" class="btn">
                <span>💼</span> LinkedIn
            </a>
            <a href="about.html" class="btn btn-about">
                <span>🦊</span> Meet Kaia & Setup
            </a>
            <a href="https://journal.honweng.com" target="_blank" class="btn">
                <span>📖</span> Journal
            </a>
        </div>

        <div class="footer">
            Powered by Kaia 🦊
        </div>
    </div>
</body>
</html>
