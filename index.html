<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hon Weng • Software Engineer & Builder</title>
    <style>
        :root {
            --bg: #0b0f19;
            --card-bg: rgba(22, 27, 46, 0.85);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.25);
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.12) 0px, transparent 50%);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
        }

        .profile-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 2.5rem 2.25rem 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px var(--border);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .logo-ring {
            width: 130px;
            height: 130px;
            margin: 0 auto 1.25rem;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(59,130,246,0.22) 0%, rgba(11,15,25,1) 75%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 35px var(--accent-glow), 0 0 0 1px var(--border);
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        h1 {
            margin: 0 0 0.4rem 0;
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .role-tag {
            display: inline-block;
            color: var(--accent);
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 0.9rem 1.25rem;
            background-color: rgba(255, 255, 255, 0.04);
            color: var(--text);
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border);
        }

        .btn:hover {
            background-color: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
        }

        .btn-about {
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.12), rgba(236, 72, 153, 0.12));
            border-color: rgba(249, 115, 22, 0.35);
            color: #fb923c;
        }

        .btn-about:hover {
            border-color: #fb923c;
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.22), rgba(236, 72, 153, 0.22));
            box-shadow: 0 6px 20px rgba(249, 115, 22, 0.25);
        }

        .footer {
            margin-top: 2.25rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <div class="logo-ring">
            <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <!-- CPU Die & IC Circuitry in Bottom Area -->
                <rect x="55" y="115" width="90" height="60" rx="4" fill="none" stroke="#1e3a8a" stroke-width="1.5" stroke-dasharray="2,2"/>
                <rect x="65" y="125" width="70" height="40" rx="2" fill="rgba(30, 58, 138, 0.2)" stroke="#3b82f6" stroke-width="1"/>
                
                <!-- ALU / Core Internal Bus Lines -->
                <line x1="75" y1="135" x2="125" y2="135" stroke="#3b82f6" stroke-width="1" opacity="0.7"/>
                <line x1="75" y1="145" x2="125" y2="145" stroke="#3b82f6" stroke-width="1" opacity="0.7"/>
                <line x1="75" y1="155" x2="125" y2="155" stroke="#3b82f6" stroke-width="1" opacity="0.7"/>
                <line x1="90" y1="125" x2="90" y2="165" stroke="#3b82f6" stroke-width="1" opacity="0.7"/>
                <line x1="110" y1="125" x2="110" y2="165" stroke="#3b82f6" stroke-width="1" opacity="0.7"/>

                <!-- IC Pins / Traces radiating outward -->
                <line x1="75" y1="125" x2="75" y2="105" stroke="#3b82f6" stroke-width="1.5"/>
                <line x1="100" y1="125" x2="100" y2="100" stroke="#3b82f6" stroke-width="1.5"/>
                <line x1="125" y1="125" x2="125" y2="105" stroke="#3b82f6" stroke-width="1.5"/>
                
                <line x1="75" y1="165" x2="75" y2="185" stroke="#3b82f6" stroke-width="1.5"/>
                <line x1="100" y1="165" x2="100" y2="190" stroke="#3b82f6" stroke-width="1.5"/>
                <line x1="125" y1="165" x2="125" y2="185" stroke="#3b82f6" stroke-width="1.5"/>
                
                <line x1="65" y1="135" x2="40" y2="135" stroke="#3b82f6" stroke-width="1.5"/>
                <line x1="65" y1="155" x2="35" y2="155" stroke="#3b82f6" stroke-width="1.5"/>
                <line x1="135" y1="135" x2="160" y2="135" stroke="#3b82f6" stroke-width="1.5"/>
                <line x1="135" y1="155" x2="165" y2="155" stroke="#3b82f6" stroke-width="1.5"/>

                <!-- IC Pin Nodes / Pads -->
                <circle cx="75" cy="105" r="2" fill="#60a5fa"/>
                <circle cx="100" cy="100" r="2" fill="#60a5fa"/>
                <circle cx="125" cy="105" r="2" fill="#60a5fa"/>
                <circle cx="75" cy="185" r="2" fill="#60a5fa"/>
                <circle cx="100" cy="190" r="2" fill="#60a5fa"/>
                <circle cx="125" cy="185" r="2" fill="#60a5fa"/>
                <circle cx="40" cy="135" r="2" fill="#60a5fa"/>
                <circle cx="35" cy="155" r="2" fill="#60a5fa"/>
                <circle cx="160" cy="135" r="2" fill="#60a5fa"/>
                <circle cx="165" cy="155" r="2" fill="#60a5fa"/>

                <!-- Upper Background Circuit Lines -->
                <path d="M 30 70 L 60 70 L 75 85" fill="none" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M 170 70 L 140 70 L 125 85" fill="none" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round"/>
                <circle cx="30" cy="70" r="2.5" fill="#3b82f6"/>
                <circle cx="170" cy="70" r="2.5" fill="#3b82f6"/>

                <!-- HW Letters (Positioned slightly above center) -->
                <text x="100" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="-2">HW</text>
            </svg>
        </div>

        <h1>Hon Weng</h1>
        <span class="role-tag">Software Engineer & Builder</span>

        <div class="links">
            <a href="https://github.com/honweng" target="_blank" class="btn">
                <span>💻</span> GitHub
            </a>
            <a href="https://www.linkedin.com/in/yeehonweng/" target="_blank" class="btn">
                <span>💼</span> LinkedIn
            </a>
            <a href="https://journal.honweng.com" target="_blank" class="btn">
                <span>✍️</span> Scribblings
            </a>
            <a href="about.html" class="btn btn-about">
                <span>🦊</span> Meet Kaia & Setup
            </a>
        </div>

        <div class="footer">
            Powered by Kaia 🦊
        </div>
    </div>
</body>
</html>
