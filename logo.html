<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HW Tech Logo</title>
    <style>
        body {
            background-color: #0b0f19;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .logo-container {
            width: 300px;
            height: 300px;
            position: relative;
            background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, rgba(11,15,25,1) 70%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.2);
        }
        svg {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <!-- Circuit Paths -->
            <path d="M 40 100 L 70 100 L 85 85" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
            <path d="M 160 100 L 130 100 L 115 115" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
            <path d="M 100 40 L 100 65 L 85 80" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
            <path d="M 100 160 L 100 135 L 115 120" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>

            <!-- Circuit Nodes -->
            <circle cx="40" cy="100" r="3" fill="#3b82f6" />
            <circle cx="160" cy="100" r="3" fill="#3b82f6" />
            <circle cx="100" cy="40" r="3" fill="#3b82f6" />
            <circle cx="100" cy="160" r="3" fill="#3b82f6" />
            <circle cx="85" cy="85" r="2" fill="#60a5fa" />
            <circle cx="115" cy="115" r="2" fill="#60a5fa" />

            <!-- HW Letters -->
            <text x="100" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="-2">HW</text>
        </svg>
    </div>
</body>
</html>
